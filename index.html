<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3D Premium Weather Dashboard</title>

    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* =====================================================
           GLOBAL RESET
        ====================================================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        /* =====================================================
           BODY
        ====================================================== */

        body{

            font-family:'Poppins',sans-serif;

            min-height:100vh;

            display:flex;
            justify-content:center;
            flex-direction:column;
            align-items:center;

            overflow:hidden;

            padding:2rem;

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            transition:1s ease;

            color:white;

        }

        /* =====================================================
           WEATHER BACKGROUNDS
        ====================================================== */

        body.clear{

            background-image:
            linear-gradient(
                rgba(0,0,0,0.35),
                rgba(0,0,0,0.35)
            ),

            url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

        }

        body.clouds{

            background-image:
            linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ),

            url("https://images.unsplash.com/photo-1534088568595-a066f410bcda");

        }

        body.rain{

            background-image:
            linear-gradient(
                rgba(0,0,0,0.55),
                rgba(0,0,0,0.55)
            ),

            url("https://images.unsplash.com/photo-1515694346937-94d85e41e6f0");

        }

        body.snow{

            background-image:
            linear-gradient(
                rgba(0,0,0,0.35),
                rgba(0,0,0,0.35)
            ),

            url("https://images.unsplash.com/photo-1483664852095-d6cc6870702d");

        }

        body.thunderstorm{

            background-image:
            linear-gradient(
                rgba(0,0,0,0.6),
                rgba(0,0,0,0.6)
            ),

            url("https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28");

        }

        /* =====================================================
           GLASS CONTAINER
        ====================================================== */

        .container{

            width:100%;
            max-width:760px;
margin-top: 100px;
            background:
            rgba(255,255,255,0.08);

            border:
            1px solid rgba(255,255,255,0.12);

            backdrop-filter:blur(20px);

            border-radius:30px;

            padding:2rem;

            box-shadow:
            0 8px 32px rgba(0,0,0,0.35);

            animation:fadeIn 1s ease;

        }

        /* =====================================================
           HEADER
        ====================================================== */
/* =====================================================
   HEADER
====================================================== */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:2rem;

}

/* =====================================================
   THEME BUTTON
====================================================== */

.theme-btn{

    border:none;

    padding:12px 20px;

    border-radius:50px;

    background:
    linear-gradient(
        45deg,
        #2563eb,
        #3b82f6
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

.theme-btn:hover{

    transform:scale(1.05);

}

        .header h1{

            font-size:2.8rem;

            background:
            linear-gradient(
                45deg,
                #ffffff,
                #60a5fa
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;

        }

        /* =====================================================
           SEARCH BOX
        ====================================================== */

        .search-box{

            display:flex;

            gap:1rem;

            margin-bottom:2rem;

        }

        .search-box input{

            flex:1;

            padding:1rem;

            border:none;

            border-radius:15px;

            background:
            rgba(255,255,255,0.12);

            color:white;

            font-size:1rem;

            outline:none;

        }

        .search-box input::placeholder{

            color:#d1d5db;

        }

        .search-box button{

            border:none;

            padding:1rem 1.5rem;

            border-radius:15px;

            background:
            linear-gradient(
                45deg,
                #2563eb,
                #3b82f6
            );

            color:white;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;

        }

        .search-box button:hover{

            transform:scale(1.05);

        }

        /* =====================================================
           WEATHER CARD
        ====================================================== */

        .weather-card{

            display:none;

            animation:fadeIn 0.5s ease;

        }

        /* =====================================================
           TOP BAR
        ====================================================== */

        .top-bar{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:1rem;

        }

        .location h2{

            font-size:2rem;

        }

        .location p{

            opacity:0.8;

        }

        /* =====================================================
           WEATHER IMAGE
        ====================================================== */

        .weather-image{

            display:flex;
            justify-content:center;

        }

        .weather-image img{

            width:170px;

            animation:float 3s ease-in-out infinite;

        }

        /* =====================================================
           TEMPERATURE
        ====================================================== */

        .temperature{

            text-align:center;

            font-size:5rem;

            font-weight:700;

            margin-top:-10px;

            background:
            linear-gradient(
                45deg,
                #ffffff,
                #93c5fd
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;

        }

        /* =====================================================
           DESCRIPTION
        ====================================================== */

        .description{

            text-align:center;

            text-transform:capitalize;

            font-size:1.2rem;

            margin-bottom:2rem;

            opacity:0.9;

        }

        /* =====================================================
           DETAILS GRID
        ====================================================== */

        .details{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(140px,1fr));

            gap:1rem;

        }

        .detail-card{

            background:
            rgba(255,255,255,0.08);

            border:
            1px solid rgba(255,255,255,0.1);

            padding:1rem;

            border-radius:20px;

            text-align:center;

            transition:0.3s;

        }

        .detail-card:hover{

            transform:
            translateY(-5px)
            scale(1.03);

        }

        .detail-card h3{

            color:#93c5fd;

            margin-bottom:0.5rem;

        }

        .detail-card p{

            font-size:1.1rem;

            font-weight:600;

        }

        /* =====================================================
           LOADING + ERROR
        ====================================================== */

        .loading,
        .error{

            text-align:center;

            margin-top:1rem;

            font-weight:bold;

            display:none;

        }

        .error{

            color:#ff6b6b;

        }
    .tagline{

    text-align:center;

    margin-bottom:1rem;

    opacity:0.85;

    color:#dbeafe;

    animation:
    welcomeAnimation 2.5s ease-in;

}

        /* =====================================================
           ANIMATIONS
        ====================================================== */

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-12px);
            }

            100%{
                transform:translateY(0px);
            }

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(-10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }
        @keyframes welcomeAnimation{

    0%{

        opacity:0;

        transform:
        translateY(-20px);

    }

    100%{

        opacity:0.85;

        transform:
        translateY(0);

    }

}

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media(max-width:700px){

            .search-box{

                flex-direction:column;

            }

            .temperature{

                font-size:4rem;

            }

        }
      footer{

    margin-top:auto;

    padding-top:2rem;

    text-align:center;

    width:100%;

    opacity:0.8;

    font-size:0.9rem;

    color:white;

}

    </style>

</head>

<body class="clear">

    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">

        <!-- HEADER -->

      <div class="header">

    <h1>Weather Dashboard</h1>

    <button class="theme-btn"
            id="themeBtn">

        Change Theme

    </button>

</div>

        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Search your city..."
            >

            <button id="searchBtn">

                Search

            </button>

        </div>
        <p class="tagline">

   Designed & Developed by Neeraj

</p>

        <!-- LOADING -->

        <div class="loading"
             id="loading">

            Fetching real-time climate data...

        </div>

        <!-- ERROR -->

        <div class="error"
             id="error">

            City not found!

        </div>

        <!-- WEATHER CARD -->

        <div class="weather-card"
             id="weatherCard">

            <!-- TOP -->

            <div class="top-bar">

                <div class="location">

                    <h2 id="city">

                        City

                    </h2>

                    <p id="dateTime">

                        Date & Time

                    </p>

                </div>

            </div>

            <!-- WEATHER ICON -->

            <div class="weather-image">

                <img id="weatherIcon"
                     src=""
                     alt="Weather">

            </div>

            <!-- TEMP -->

            <h2 class="temperature"
                id="temperature">

                0°C

            </h2>

            <!-- DESCRIPTION -->

            <p class="description"
               id="description">

                Description

            </p>

            <!-- DETAILS -->

            <div class="details">

                <div class="detail-card">

                    <h3>Humidity</h3>

                    <p id="humidity">

                        0%

                    </p>

                </div>

                <div class="detail-card">

                    <h3>Wind</h3>

                    <p id="wind">

                        0 km/h

                    </p>

                </div>

                <div class="detail-card">

                    <h3>Feels Like</h3>

                    <p id="feelsLike">

                        0°C

                    </p>

                </div>

                <div class="detail-card">

                    <h3>Pressure</h3>

                    <p id="pressure">

                        0 hPa

                    </p>

                </div>

                <div class="detail-card">

                    <h3>Rain %</h3>

                    <p id="rain">

                        0%

                    </p>

                </div>

                <div class="detail-card">

                    <h3>Air Quality</h3>

                    <p id="airQuality">

                        Good

                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        // =====================================================
        // DOM ELEMENTS
        // =====================================================

        const cityInput =
        document.getElementById("cityInput");

        const searchBtn =
        document.getElementById("searchBtn");

        const weatherCard =
        document.getElementById("weatherCard");

        const loading =
        document.getElementById("loading");

        const error =
        document.getElementById("error");

        const city =
        document.getElementById("city");

        const dateTime =
        document.getElementById("dateTime");

        const weatherIcon =
        document.getElementById("weatherIcon");

        const temperature =
        document.getElementById("temperature");

        const description =
        document.getElementById("description");

        const humidity =
        document.getElementById("humidity");

        const wind =
        document.getElementById("wind");

        const feelsLike =
        document.getElementById("feelsLike");

        const pressure =
        document.getElementById("pressure");

        const rain =
        document.getElementById("rain");

        const airQuality =
        document.getElementById("airQuality");

        // =====================================================
        // FETCH WEATHER
        // =====================================================

        async function getWeather(cityName){

            loading.style.display = "block";

            error.style.display = "none";

            weatherCard.style.display = "none";

            try{

              const apiKey =
"8458c3c6cf7bf20cf28663e0f38e7b59";

const apiUrl =

`https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=${apiKey}&units=metric`;

                const response =
                await fetch(apiUrl);

                const data =
                await response.json();

                displayWeather(data);

            }

            catch(err){

                console.log(err);

                error.style.display = "block";

                error.innerText =
                "Failed to fetch weather";

            }

            finally{

                loading.style.display = "none";

            }

        }

        // =====================================================
        // DISPLAY WEATHER
        // =====================================================

     function displayWeather(data){

    weatherCard.style.display =
    "block";

    city.innerText =
    cityInput.value;

    const now =
    new Date();

    dateTime.innerText =
    now.toLocaleString();

    const current = data;
    // TEMPERATURE

    temperature.innerText =
    `${Math.round(current.main.temp)}°C`;

    // DESCRIPTION

    description.innerText =
   current.weather[0].description;

    // WIND

    wind.innerText =
    `${current.wind.speed} km/h`;

    // EXTRA DETAILS

    humidity.innerText =
    `${current.main.humidity}%`;

    feelsLike.innerText =
    `${Math.round(current.main.feels_like)}°C`;

    pressure.innerText =
    `${current.main.pressure} hPa`;

    rain.innerText =
    `${current.clouds.all}%`;

    // AIR QUALITY

    const quality = [

        "Good",
        "Moderate",
        "Poor"

    ];

    airQuality.innerText =

    quality[
        Math.floor(Math.random()*3)
    ];

    // WEATHER TYPE

    const weatherText =
    current.weather[0]
.main
.toLowerCase();

    // SUNNY

    if(weatherText.includes("sun")){

        weatherIcon.src =
        "https://cdn-icons-png.flaticon.com/512/869/869869.png";

        document.body.className =
        "clear";

    }

    // CLOUDY

    else if(weatherText.includes("cloud")){

        weatherIcon.src =
        "https://cdn-icons-png.flaticon.com/512/414/414825.png";

        document.body.className =
        "clouds";

    }

    // RAIN

    else if(weatherText.includes("rain")){

        weatherIcon.src =
        "https://cdn-icons-png.flaticon.com/512/1163/1163657.png";

        document.body.className =
        "rain";

    }

    // SNOW

    else if(weatherText.includes("snow")){

        weatherIcon.src =
        "https://cdn-icons-png.flaticon.com/512/642/642102.png";

        document.body.className =
        "snow";

    }

    // DEFAULT

    else{

        weatherIcon.src =
        "https://cdn-icons-png.flaticon.com/512/1779/1779940.png";

        document.body.className =
        "thunderstorm";

    }

}

        // =====================================================
        // SEARCH BUTTON
        // =====================================================

        searchBtn.addEventListener("click",()=>{

            const cityName =
            cityInput.value.trim();

            if(cityName !== ""){

                getWeather(cityName);

            }

        });

        // =====================================================
        // ENTER KEY SUPPORT
        // =====================================================

        cityInput.addEventListener("keypress",(e)=>{

            if(e.key === "Enter"){

                searchBtn.click();

            }

        });
        // =====================================================
// THEME BUTTON
// =====================================================

const themes = [

    "clear",
    "clouds",
    "rain",
    "snow",
    "thunderstorm"

];

document
.getElementById("themeBtn")
.addEventListener("click",()=>{

    const randomTheme =

    themes[
        Math.floor(Math.random()*themes.length)
    ];

    document.body.className =
    randomTheme;

});

    </script>
   
  

</body>

 <footer>

</footer>

</html>
